name: Build RustDesk Client
on:
  push:
    branches: [ "main" ]
    tags: [ 'v*' ]
  workflow_dispatch: # 允许手动触发
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Cache vcpkg installed libs
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-cache-v2-${{ github.job }}
          restore-keys: |
            vcpkg-cache-v2-

      - name: Cache Flutter pub‑cache
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: flutter-pub-${{ hashFiles('flutter/pubspec.lock') }}
          restore-keys: |
            flutter-pub-

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          cache: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-cache-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
          restore-keys: |
            rust-cache-

      - name: Install Dependencies (vcpkg)
        run: |
          if (-Not (Test-Path "C:\vcpkg")) {
            git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
            C:\vcpkg\bootstrap-vcpkg.bat
          }
          echo "VCPKG_ROOT=C:\vcpkg" >> $GITHUB_ENV
          C:\vcpkg\vcpkg.exe install libvpx:x64-windows-static libyuv:x64-windows-static opus:x64-windows-static aom:x64-windows-static ffmpeg:x64-windows-static libmfx:x64-windows-static --classic
        shell: pwsh

      - name: Configure Custom Server (Optional)
        shell: bash
        run: |
          CUSTOM_ID_SERVER="your-id-server.com"
          CUSTOM_RELAY_SERVER="your-relay-server.com:21117"
          CUSTOM_KEY="your-public-key-here"
          echo "Configuration injected."

      - name: Build Release with official build.py
        run: python build.py --flutter --hwcodec
        env:
          VCPKG_ROOT: C:\vcpkg

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-windows-x64
          path: build/out/rustdesk.exe
