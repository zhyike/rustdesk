name: Build RustDesk Client
on:
  push:
    branches: [ "main" ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      VCPKG_ROOT: C:\vcpkg
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Cache full vcpkg
        uses: actions/cache@v4
        id: cache-vcpkg
        with:
          path: C:\vcpkg
          key: vcpkg-full-v3-${{ github.job }}
          restore-keys: |
            vcpkg-full-v3-

      - name: Cache Flutter pub‑cache
        uses: actions/cache@v4
        id: cache-flutter-pub
        with:
          path: ~/.pub-cache
          key: flutter-pub-${{ hashFiles('flutter/pubspec.lock') }}
          restore-keys: |
            flutter-pub-

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          cache: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust cargo & target
        uses: actions/cache@v4
        id: cache-rust
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            ./target
          key: rust-cache-${{ github.job }}-${{ hashFiles('**/Cargo.toml','**/Cargo.lock') }}
          restore-keys: |
            rust-cache-${{ github.job }}-

      - name: Install Dependencies (vcpkg)
        shell: pwsh
        run: |
          if (-Not (Test-Path "C:\vcpkg")) {
            git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
            C:\vcpkg\bootstrap-vcpkg.bat
          }
          C:\vcpkg\vcpkg.exe install libvpx:x64-windows-static --classic
          C:\vcpkg\vcpkg.exe install libyuv:x64-windows-static --classic
          C:\vcpkg\vcpkg.exe install opus:x64-windows-static --classic
          C:\vcpkg\vcpkg.exe install aom:x64-windows-static --classic

      - name: Configure Custom Server Env
        shell: bash
        run: |
          export CUSTOM_ID_SERVER="your-id-server.com"
          export CUSTOM_RELAY_SERVER="your-relay-server.com:21117"
          export CUSTOM_KEY="your-public-key-here"
          echo "Custom server env loaded"

      - name: Install flutter_rust_bridge v1 cli
        shell: pwsh
        run: |
          cd flutter
          flutter pub get
          dart pub global activate flutter_rust_bridge 1.80.1
          $env:PATH += ";${env:USERPROFILE}\.pub\bin"
          echo "$env:USERPROFILE\.pub\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Build Release with official build.py
        run: python build.py --flutter
        env:
          VCPKG_ROOT: C:\vcpkg

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-windows-x64
          path: build/out/rustdesk.exe
